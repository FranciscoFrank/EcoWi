name: Pages

# Publishes site/ to GitHub Pages. One-time setup: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/site/**"
      - "docs/*.svg"
      - "app/src/main/res/font/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build the site
        run: python3 tools/site/build.py _site --base-url "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
