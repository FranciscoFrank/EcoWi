name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "site/**"
      - "tools/site/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "site/**"
      - "tools/site/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/android-setup

      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      # Advisory for now: the report is uploaded, findings don't fail the build.
      - name: Android lint
        continue-on-error: true
        run: ./gradlew lintDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: EcoWi-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
